<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <meta name="description" content="We couldn't find the page you were looking for.">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/animations.css">
  <style>
    .error-section {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <main>
    <section class="section error-section">
      <div class="container">
        <h1 class="massive-title scroll-reveal" style="margin-bottom: 24px;">Oops!</h1>
        <p class="body scroll-reveal stagger-1" style="color: var(--muted-ink); margin-bottom: 40px;">
          We couldn’t find the page you were looking for
        </p>
        <div class="scroll-reveal stagger-2">
          <a href="index.html" class="btn-arrow dark">
            <span class="rolling-text"><span class="rolling-text-inner"><span>Go Back</span><span>Go Back</span></span></span>
            <div class="arrow-box">
              <div class="arrow-inner">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="js/main.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
